name: Phase 04 verification

on: [push, pull_request, workflow_dispatch]

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DATABASE_URL: postgresql://rdl_ci@127.0.0.1:5432/rdl_test_ci?sslmode=disable
      TEST_DATABASE_URL: postgresql://rdl_ci@127.0.0.1:5432/rdl_test_ci?sslmode=disable
      RDL_DB_POOL_MODE: direct
      RDL_DB_SSLMODE: disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: npm ci
      - run: python -m pip install -r backend/requirements.txt
      - uses: ankane/setup-postgres@v1
        with:
          postgres-version: 17
          user: rdl_ci
          database: rdl_test_ci
      - run: python -m pytest
        working-directory: backend
      - run: python -m alembic -c backend/alembic.ini upgrade head
      - run: python -m app.seed
        working-directory: backend
      - run: npm test
      - run: npm run build
      - run: npx playwright install --no-shell chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/
